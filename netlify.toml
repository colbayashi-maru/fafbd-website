# firstassetfinancial.com
#
# There is no build step at deploy time. build.py runs locally and the
# generated HTML is committed, so the host only has to serve public/.

[build]
  publish = "public"
  command = ""

# ---------------------------------------------------------------------------
# KEEP THE STAGING URL OUT OF SEARCH UNTIL CUTOVER
#
# DELETE THE BLOCK BELOW BEFORE POINTING DNS AT THIS SITE.
#
# It is a blanket noindex over every path. If it survives the cutover the real
# site stays invisible to Google indefinitely, silently, with nothing on the
# page to show for it. This is the single easiest step to forget and the most
# expensive one to discover late.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Security headers
#
# The pages load Google Fonts and nothing else third-party, so a real CSP is
# possible. If anything is ever added — analytics, a chat widget, an embedded
# form — its origin has to be named here IN THE SAME COMMIT. A script-src that
# does not name the origin blocks the tag silently: no error a visitor or an
# editor would ever see, just a site that quietly does nothing.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data:;
      object-src 'none';
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests"""
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# One week, not a year. A filing that is replaced must reach readers quickly —
# which is also why a replacement gets a NEW filename rather than overwriting
# an existing one. An overwritten document would sit stale in caches while the
# superseded version was still being served.
[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    X-Content-Type-Options = "nosniff"

# ---------------------------------------------------------------------------
# Redirects from the previous site
#
# The site being replaced is a PHP site whose URLs all end in .php. Netlify
# paths are case-sensitive, so each one is listed in both the lower-case form
# the site linked and the capitalized form that turns up in logs.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/services.php"
  to = "/services/"
  status = 301
  force = true

[[redirects]]
  from = "/important_info.php"
  to = "/disclosures/"
  status = 301
  force = true

[[redirects]]
  from = "/investor_forms.php"
  to = "/forms/"
  status = 301
  force = true

[[redirects]]
  from = "/investor_resources.php"
  to = "/resources/"
  status = 301
  force = true

[[redirects]]
  from = "/prospective_brokers.php"
  to = "/brokers/"
  status = 301
  force = true

[[redirects]]
  from = "/contact.php"
  to = "/contact/"
  status = 301
  force = true

# The Base44 prototype's paths, in case anything was shared from it.
[[redirects]]
  from = "/investor-information"
  to = "/services/"
  status = 301
  force = true

[[redirects]]
  from = "/important-information"
