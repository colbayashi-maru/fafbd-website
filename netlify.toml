  to = "/form-crs/"
  status = 301
  force = true

# Anything else still under the old PDF folder lands on the disclosures page
# rather than a 404, because a customer following a link from a printed packet
# is looking for a document and the page lists all of them.
[[redirects]]
  from = "/assets/pdf/*"
  to = "/disclosures/"
  status = 301

[[redirects]]
  from = "/*.php"
  to = "/404.html"
  status = 404
